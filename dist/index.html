*{box-sizing:border-box}body{margin:0;background:#101619;color:#d8e5e2;font:14px/1.65 'Microsoft YaHei',sans-serif}main{max-width:1160px;padding:38px 30px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:28px}h1{font-size:25px;font-weight:500;margin:4px 0 7px}p{margin:0;color:#91a5a4}.eyebrow{font:10px/1.4 Consolas,monospace;letter-spacing:3px;color:#59ad9c}button{border:1px solid #35474b;color:#b9d2ca;background:#192428;padding:8px 14px;cursor:pointer}button:hover{border-color:#62b49e}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#152025;border:1px solid #29383d;padding:20px;min-height:254px}.card h2{font-size:13px;font-weight:500;margin:0;color:#bad1ca}.card p{font-size:11px;margin:4px 0 25px}.stage{height:164px;display:flex;align-items:center;justify-content:center;padding-right:88px;position:relative;background:radial-gradient(ellipse at 65% 40%,#293e3a,#142126 65%);border:1px solid #283a3e}.light .stage{background:linear-gradient(135deg,#c3c4ae,#8d9b86)}.busy .stage{background:repeating-linear-gradient(140deg,#44372a 0 15px,#33463c 15px 35px,#1d3543 35px 48px)}.hud{position:relative;width:136px;height:92px;transform:scale(1.3);transform-origin:50% 50%;font-family:Arial,'Microsoft YaHei',sans-serif}.bars{height:48px;display:flex;gap:4px;position:relative}.slot{position:relative;width:24px;height:48px;border:1px solid rgba(4,6,7,1);background:rgba(14,17,19,0.85)}.native{position:absolute;inset:0;background:rgba(26,102,89,.5)}.uncertain .native{background:rgb(26,102,89)}.fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(20,125,112,1),rgba(51,186,158,1))}.seconds{position:absolute;top:51px;left:-1px;width:24px;text-align:center;font-size:11px;line-height:13px;font-variant-numeric:tabular-nums;color:rgba(217,235,230,1);text-shadow:-1px -1px 0 #101719,1px 1px 0 #101719}.badge{position:absolute;bottom:100%;left:0;margin-bottom:4px;font-size:10px;color:rgba(145,163,166,1);text-shadow:0 1px #081015}.debt .bars,.cancel .bars{outline:1px solid #a36e35}.debt-lane{position:absolute;left:calc(100% + 8px);top:0;display:flex;gap:4px;animation:approach 1.6s ease-in-out infinite}.debt-bar{position:relative;border:1px solid #040607;background:rgba(51,11,11,.85);width:24px;height:48px}.debt-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(156,31,33,1),rgba(224,64,59,1))}.debt-bar .seconds{color:#ff9487;font-style:normal}.alert{position:absolute;top:71px;left:0;width:100%;font-size:14px;text-align:center;line-height:20px;color:rgb(245,92,79);text-shadow:-1px -1px #191514,1px 1px #191514}.legend{margin-top:21px;border-top:1px solid #29383d;padding-top:20px;display:flex;gap:24px;flex-wrap:wrap;font-size:12px;color:#91a5a4}.legend b{color:#b5d3c8;font-weight:400}.downloads{margin-top:22px;display:flex;gap:24px}.downloads a{color:#68c0ac}footer{margin-top:20px;color:#718884;font-size:11px}.paused .debt-lane{animation-play-state:paused}

</style><main><header><div><div class="eyebrow">EXECUTIONER WATCH / 0.9.1</div><h1>五层计时，简洁可读。</h1><p>原生层数保留，预测层有明确标识。红条紧贴主组右侧。</p></div><div class="controls"><button id="backdrop">切换背景</button> <button id="motion">暂停动画</button></div></header><div class="grid"></div><div class="legend"><span><b>暗色整槽</b> · 游戏原生层数</span><span><b>亮色高度 + 秒数</b> · 预计剩余时间</span><span><b>红色计时条</b> · 预测欠层</span></div><div class="downloads"><a href="https://github.com/lesnolie/ExecutionerWatch/releases/latest/download/ExecutionerWatch-0.9.1.zip">插件安装包</a><a href="https://github.com/lesnolie/ExecutionerWatch/releases/latest/download/ExecutionerProbe-0.9.1.zip">可选诊断探针</a></div><footer>此页读取 Lua 的尺寸、颜色和预览数据，按 1.3 倍展示，便于检查。浏览器字体与游戏渲染不同；这不是游戏实测截图。游戏中 /ew 可直接切换相同的四种预览。</footer></main><script>
const theme={"layout":{"width":24,"gap":4,"height":48,"timerHeight":16,"debtWidth":24,"debtGap":4,"pitch":28,"total":136},"colors":{"slot":[0.055,0.065,0.075,0.85],"line":[0.015,0.022,0.026,1],"low":[0.08,0.49,0.44,1],"high":[0.2,0.73,0.62,1],"debtLow":[0.61,0.12,0.13,1],"debtHigh":[0.88,0.25,0.23,1],"muted":[0.57,0.64,0.65,1],"text":[0.85,0.92,0.9,1]},"states":{"normal":{"state":"ACTIVE","count":3,"debt":0,"rows":[{"duration":18,"expiresAt":104.6},{"duration":18,"expiresAt":107.3},{"duration":18,"expiresAt":110}],"debtRows":{},"reason":"预览"},"debt":{"state":"ACTIVE","count":5,"debt":2,"rows":[{"duration":18,"expiresAt":104.6},{"duration":18,"expiresAt":107.3},{"duration":18,"expiresAt":110},{"duration":18,"expiresAt":112.7},{"duration":18,"expiresAt":115.4}],"debtRows":[{"id":6,"duration":18,"expiresAt":116},{"id":7,"duration":18,"expiresAt":118}],"reason":"预览"},"cancel":{"state":"ACTIVE","count":2,"debt":2,"rows":[{"duration":18,"expiresAt":104.6},{"duration":18,"expiresAt":107.3}],"debtRows":[{"id":3,"duration":18,"expiresAt":116},{"id":4,"duration":18,"expiresAt":118}],"reason":"预览"},"uncertain":{"state":"UNCERTAIN","count":3,"debt":0,"rows":[{"duration":18,"expiresAt":104.6},{"duration":18,"expiresAt":107.3},{"duration":18,"expiresAt":110}],"debtRows":{},"reason":"预览"}}};
const labels={normal:['正常','独立秒数统一对齐，主组位置固定。'],debt:['欠层','外部独立倒计时，移入主框后保留剩余时间。'],cancel:['取消','提醒居中，与秒数分行；默认阈值为两层。'],uncertain:['预测暂停','隐藏不可靠秒数；仍由原生控件显示层数。']};
for(const mode of ['normal','debt','cancel','uncertain']){const s=theme.states[mode];const card=document.createElement('section');card.className='card '+mode;card.innerHTML='<h2>'+labels[mode][0]+'</h2><p>'+labels[mode][1]+'</p><div class="stage"><div class="hud"><div class="bars"></div></div></div>';const hud=card.querySelector('.hud');const bars=card.querySelector('.bars');for(let i=0;i<5;i++){const slot=document.createElement('div');slot.className='slot';if(i<s.count)slot.innerHTML='<i class="native"></i>';if(s.state==='ACTIVE'&&s.rows[i]){const remaining=s.rows[i].expiresAt-100;slot.innerHTML+='<i class="fill" style="height:'+Math.min(100,remaining/s.rows[i].duration*100)+'%"></i><span class="seconds">'+remaining.toFixed(1)+'</span>';}bars.append(slot);}const badge=document.createElement('span');badge.className='badge';badge.textContent=s.state==='ACTIVE'?'~':'?';bars.append(badge);if(s.debt){const lane=document.createElement('div');lane.className='debt-lane';for(const r of s.debtRows){const left=r.expiresAt-100;lane.innerHTML+='<i class="debt-bar"><i class="debt-fill" style="height:'+Math.min(100,left/r.duration*100)+'%"></i><span class="seconds">'+left.toFixed(1)+'</span></i>';}hud.append(lane);}if(mode==='cancel')hud.innerHTML+='<div class="alert">! 取消 !</div>';document.querySelector('.grid').append(card);}
let backdrop=0;document.querySelector('#backdrop').onclick=()=>{backdrop=(backdrop+1)%3;document.body.classList.toggle('light',backdrop===1);document.body.classList.toggle('busy',backdrop===2);};document.querySelector('#motion').onclick=()=>{const paused=document.body.classList.toggle('paused');document.querySelector('#motion').textContent=paused?'播放动画':'暂停动画';};
</script></html>
